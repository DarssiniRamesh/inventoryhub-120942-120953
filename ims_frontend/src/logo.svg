<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7fb8f0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#424242;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="50" cy="50" r="45" fill="url(#grad1)" />
  
  <!-- Inventory boxes -->
  <rect x="25" y="25" width="15" height="15" fill="#fddeaf" rx="2" />
  <rect x="45" y="25" width="15" height="15" fill="#ffffff" rx="2" />
  <rect x="65" y="25" width="15" height="15" fill="#fddeaf" rx="2" />
  
  <rect x="25" y="45" width="15" height="15" fill="#ffffff" rx="2" />
  <rect x="45" y="45" width="15" height="15" fill="#fddeaf" rx="2" />
  <rect x="65" y="45" width="15" height="15" fill="#ffffff" rx="2" />
  
  <rect x="25" y="65" width="15" height="15" fill="#fddeaf" rx="2" />
  <rect x="45" y="65" width="15" height="15" fill="#ffffff" rx="2" />
  <rect x="65" y="65" width="15" height="15" fill="#fddeaf" rx="2" />
  
  <!-- Center hub icon -->
  <circle cx="50" cy="50" r="8" fill="#424242" />
  <circle cx="50" cy="50" r="4" fill="#ffffff" />
</svg>
